@if (isShellVisible()) {
  <app-sidebar
    [isOpen]="isSidebarOpen()"
    [isMobile]="isMobile()"
    [isLoading]="isAppLoading()"
    [isInitializing]="isInitializing()"
    (closeSidebar)="closeSidebar()"
    (toggleSidebar)="toggleSidebar()"
    (expandSidebar)="expandSidebar()"></app-sidebar>
}

<!-- With the shell, the page is a rounded card inset in the dark frame and scrolls inside itself, so all four corners stay visible. -->
<div
  class="min-h-screen"
  [class.bg-nav-bg]="isShellVisible()"
  [class.h-screen]="isShellVisible()"
  [class.py-1]="isShellVisible()"
  [class.pr-1]="isShellVisible()">
  <div
    [id]="appScrollId"
    cdkScrollable
    class="relative ease-in-out flex flex-col bg-white dark:bg-primary-bg"
    [class.min-h-screen]="!isShellVisible()"
    [class.transition-[margin]]="!isInitializing() && isShellVisible()"
    [class.duration-300]="!isInitializing() && isShellVisible()"
    [style.margin-left]="contentOffset()"
    [class.h-full]="isShellVisible()"
    [class.overflow-y-auto]="isShellVisible()"
    [class.rounded-2xl]="isShellVisible()">
    <main class="flex-grow">
      <router-outlet></router-outlet>
    </main>

    @if (isShellVisible()) {
      <app-footer></app-footer>
    }
  </div>
</div>

<app-account-menu-modal-container></app-account-menu-modal-container>
<app-confirm-dialog></app-confirm-dialog>
