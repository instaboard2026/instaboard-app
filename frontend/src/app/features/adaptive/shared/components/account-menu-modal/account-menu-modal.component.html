<div class="flex flex-col min-w-0 py-0">
  @if (email(); as userEmail) {
    <div class="px-2 py-1">
      <p class="text-xs text-gray-600 dark:text-gray-400 truncate">{{ userEmail }}</p>
    </div>
  }

  <nav class="flex flex-col py-0">
    <button type="button" (click)="goToProfile()" class="flex items-center gap-1.5 w-full px-2 py-1 text-left text-xs text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700/60 transition-colors">
      <span class="material-icons-outlined text-base text-gray-500 dark:text-gray-400 flex-shrink-0">person</span>
      <span>Profile</span>
    </button>
  </nav>
</div>
